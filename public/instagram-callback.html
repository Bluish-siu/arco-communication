<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Connecting Instagram & ARCO...</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #0f172a;
      }
      .card {
        text-align: center;
        padding: 32px;
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
        border: 1px solid #e2e8f0;
        max-width: 380px;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #e1306c;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h3 { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
      p { margin: 0; font-size: 13px; color: #64748b; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <h3>Connecting with Meta...</h3>
      <p>Completing your Instagram authorization. This window will close automatically.</p>
    </div>
    <script>
      (function() {
        var hash = window.location.hash.substring(1);
        var params = new URLSearchParams(hash);
        var accessToken = params.get('access_token');
        var error = params.get('error') || new URLSearchParams(window.location.search).get('error');

        if (window.opener) {
          if (accessToken) {
            window.opener.postMessage({ type: 'IG_OAUTH_SUCCESS', accessToken: accessToken }, '*');
          } else {
            window.opener.postMessage({ type: 'IG_OAUTH_ERROR', error: error || 'Authentication was cancelled' }, '*');
          }
          setTimeout(function() {
            window.close();
          }, 600);
        } else {
          // Fallback if opener is detached
          if (accessToken) {
            sessionStorage.setItem('ig_temp_access_token', accessToken);
            window.location.href = '/dashboard';
          }
        }
      })();
    </script>
  </body>
</html>
